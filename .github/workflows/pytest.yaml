name: pytests

on:
  - push

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update 
        sudo apt-get install -y libopenmpi-dev openmpi-bin build-essential
        python -m pip install --upgrade pip
        pip install six==1.15.0 numpy==1.26 scipy Cython h5py mpi4py
        python -m pip install .
        python -m pip install pytest pytest-mpi
    - name: Run tests
      run: |
        python -m pytest thecov/tests
        mpirun -n 2 python -m pytest --with-mpi -m mpi thecov/tests